<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karen Luiza - 17 Anos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- TELA 1: INÍCIO -->
    <div id="tela-inicio" class="screen active">
        <div class="container-arte">
            <img src="arte.jpeg" alt="Convite Karen Luiza" class="fundo-convite">
            <button id="btn-proximo" class="btn-central"></button>
        </div>
    </div>

    <!-- TELA 2: TABELA DE PERGUNTAS -->
    <div id="tela-perguntas" class="screen">
        <div class="container-arte">
            <img src="perguntas.jpeg" alt="Tabela de Perguntas" class="fundo-convite">
            
            <form id="form-mensagem" class="form-flutuante">
                <input type="text" id="nome-convidado" class="input-arte campo-1" placeholder="" required>
                <input type="text" id="pergunta-gosta" class="input-arte campo-2" placeholder="" required>
                <input type="text" id="pergunta-presente" class="input-arte campo-3" placeholder="" required>
                <input type="text" id="pergunta-fora" class="input-arte campo-4" placeholder="" required>
                <input type="text" id="pergunta-confirmou" class="input-arte campo-5" placeholder="" required>
                <input type="text" id="pergunta-beber" class="input-arte campo-6" placeholder="" required>
                
                <button type="submit" class="campo-botao">Enviar Respostas</button>
            </form>
        </div>
    </div>

    <!-- TELA 3: VISUALIZAÇÃO DO CONVITE COM O BOTÃO NO CANTO -->
    <div id="tela-convite" class="screen">
        <div class="container-arte">
            <img src="convite.jpeg" alt="Convite Karen Luiza" class="fundo-convite">
            
            <!-- Botão no canto que faz a telinha de download aparecer -->
            <button id="btn-abrir-modal" class="btn-baixar-canto" title="Baixar Convite">
                <i class="fa-solid fa-download"></i> Baixar
            </button>
        </div>

        <!-- A "TELINHA" DE DOWNLOAD (Fica escondida até clicarem no botão do canto) -->
        <div id="modal-download" class="modal-fundo">
            <div class="card-formulario modal-conteudo">
                <button id="btn-fechar-modal" class="btn-fechar">&times;</button>
                <h2>Tudo Pronto!</h2>
                <p style="color: #fff; margin-bottom: 20px; font-size: 14px;">Obrigado por responder! Podes baixar o convite oficial abaixo:</p>
                <a href="convite.jpeg" download="convite-karen.jpeg" class="btn-enviar" style="display: block; text-decoration: none; text-align: center;">Baixar Convite Agora</a>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
