<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karen Luiza - 17 Anos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="tela-inicio" class="screen active">
        <div class="container-arte">
            <img src="arte.jpeg" alt="Convite Karen Luiza" class="fundo-convite">
            <!-- Botão posicionado exatamente em cima do botão pequeno da arte -->
            <button id="btn-proximo" class="btn-central"></button>
        </div>
    </div>

    <div id="tela-perguntas" class="screen">
        <div class="card-formulario">
            <h2>Confirmação e Mensagem</h2>
            <form id="form-mensagem">
                <input type="text" id="nome-convidado" placeholder="Seu nome" required>
                <textarea id="texto-mensagem" placeholder="Sua mensagem..." rows="4" required></textarea>
                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </div>
    </div>

    <div id="tela-sucesso" class="screen">
        <div class="card-formulario">
            <h2>Tudo Pronto!</h2>
            <p style="color: #fff; margin-bottom: 20px;">Sua mensagem foi enviada com sucesso.</p>
            <a href="arte.jpeg" download="convite-karen.jpeg" class="btn-enviar" style="display: block; text-decoration: none; text-align: center;">Baixar Convite</a>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
