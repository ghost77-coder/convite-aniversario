<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Respostas - Karen 17 Anos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .painel-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            margin: 0 auto;
            color: #fff;
            display: none; /* Começa oculto até colocar a senha certa */
        }
        .card-resposta {
            background: #1a1a1a;
            border: 1px solid #ff65a3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card-resposta h3 {
            color: #ff65a3;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .card-resposta p {
            font-size: 13px;
            margin: 4px 0;
            color: #ddd;
        }
    </style>
</head>
<body>

    <div id="painel-conteudo" class="painel-container">
        <h2>Respostas dos Convidados</h2>
        <p style="margin-bottom: 20px; color: #aaa;">Lista de quem já respondeu ao convite:</p>
        <div id="lista-respostas">
            <p>A carregar respostas...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBUuuSGXy6JZGTGbQ4q8sz5qvnN003lo0po",
            authDomain: "aniversario-ce9e4.firebaseapp.com",
            projectId: "aniversario-ce9e4",
            storageBucket: "aniversario-ce9e4.appspot.com",
            messagingSenderId: "600976314403",
            appId: "1:600976314403:web:214e652f2bcb577ef22196",
            measurementId: "G-SGL63WMW19"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. Função para carregar as respostas do Firestore
        async function carregarRespostas() {
            const container = document.getElementById("lista-respostas");
            container.innerHTML = "<p>A carregar...</p>";

            try {
                const q = query(collection(db, "respostas_aniversario"), orderBy("dataEnvio", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = "<p>Ainda não há respostas registadas.</p>";
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const r = doc.data();
                    const dataFormatada = new Date(r.dataEnvio).toLocaleString('pt-BR');

                    const div = document.createElement("div");
                    div.className = "card-resposta";
                    div.innerHTML = `
                        <h3>👤 Convidado: ${r.nome || 'Anónimo'}</h3>
                        <p><strong>O que gosta:</strong> ${r.gosta}</p>
                        <p><strong>Presente:</strong> ${r.presente}</p>
                        <p><strong>Vai de fora?:</strong> ${r.fora}</p>
                        <p><strong>Já confirmou?:</strong> ${r.confirmou}</p>
                        <p><strong>Beber ou observar?:</strong> ${r.beber}</p>
                        <p style="font-size: 11px; color: #777; margin-top: 8px;">Enviado em: ${dataFormatada}</p>
                    `;
                    container.appendChild(div);
                });
            } catch (erro) {
                console.error("Erro ao carregar:", erro);
                container.innerHTML = "<p style='color: #ff4785;'>Erro ao carregar do Firebase. Verifica se o Firestore Database foi criado no painel.</p>";
            }
        }

        // 3. Verificação de senha e execução
        const SENHA_CORRETA = "170427";
        const senhaDigitada = prompt("Insere a senha de acesso ao painel de respostas:");

        if (senhaDigitada === SENHA_CORRETA) {
            document.getElementById("painel-conteudo").style.display = "block";
            carregarRespostas();
        } else {
            alert("Senha incorreta!");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
